<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuidelineGo - Clinical Assistant</title>
    <style>
        body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; background-color: #f0f4f8; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
        .chat-container { width: 100%; max-width: 500px; background: #ffffff; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 90vh; border: 1px solid #e1e8ed; }
        .chat-header { background: #0056b3; color: white; padding: 22px; text-align: center; border-bottom: 3px solid #004494; position: relative; }
        .chat-header h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
        .chat-header p { margin: 6px 0 0; font-size: 13px; opacity: 0.85; font-weight: 300; }
        .reset-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 5px; padding: 5px 10px; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .reset-btn:hover { background: rgba(255,255,255,0.4); }
        .chat-box { flex: 1; padding: 25px; overflow-y: auto; background-color: #f8fafc; display: flex; flex-direction: column; gap: 18px; }
        .message { max-width: 85%; padding: 15px 20px; border-radius: 16px; font-size: 14.5px; line-height: 1.6; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .ai-message { background: #ffffff; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
        .user-message { background: #0056b3; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-input { display: flex; padding: 18px; background: #ffffff; border-top: 1px solid #e2e8f0; }
        .chat-input input { flex: 1; padding: 14px 20px; border: 1px solid #cbd5e1; border-radius: 30px; outline: none; background: #f8fafc; color: #333; font-size: 14px; transition: 0.3s; }
        .chat-input input:focus { border-color: #0056b3; background: #fff; }
        .chat-input button { background: #0056b3; color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: 600; transition: 0.3s; margin-left: 12px; font-size: 14px; }
        .chat-input button:hover { background: #004494; transform: translateY(-1px); }
        b { color: #0056b3; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <button class="reset-btn" onclick="resetApiKey()">Reset API Key</button>
            <h2>GuidelineGo 🩺</h2>
            <p>Powered by LLaMA 3 AI</p>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message ai-message">Welcome, colleague. I am the GuidelineGo Clinical Assistant. Which medical protocol or patient case can I assist you with today?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Enter patient condition (e.g., Hypertension)...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // إخفاء المفتاح في المتصفح عشان GitHub ما يعمله بلوك
        let apiKey = localStorage.getItem('groq_api_key');
        if (!apiKey) {
            apiKey = prompt("Please enter your Groq API Key to enable real AI:");
            if (apiKey) localStorage.setItem('groq_api_key', apiKey);
        }

        function resetApiKey() {
            localStorage.removeItem('groq_api_key');
            location.reload();
        }

        const systemInstruction = "You are an expert Clinical Decision Assistant for Pharmacists in Jordan. Guide the pharmacist through clinical guidelines (e.g., Hypertension treatment) using a step-by-step 'Decision Tree' approach. Rules: 1. Ask ONLY ONE question at a time. 2. WAIT for the user. 3. Suggest Jordanian commercial brands at the end (e.g., Hikma, JPM). 4. Use professional clinical English.";
        let chatHistory = [
            { "role": "system", "content": systemInstruction }
        ];

        async function startChat() {
            if (!apiKey) {
                addMessage('ai', "API Key is missing. Please click 'Reset API Key'.");
                return;
            }

            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            addMessage('user', message);
            inputField.value = '';
            chatHistory.push({ "role": "user", "content": message });

            const loadingId = 'loading-' + Date.now();
            addMessage('ai', 'Analyzing clinical guidelines...', loadingId);

            try {
                // الاتصال بـ Groq API (LLaMA 3)
                const response = await fetch(`https://api.groq.com/openai/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", // أسرع موديل ومجاني
                        messages: chatHistory,
                        temperature: 0.2
                    })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    addMessage('ai', "API Error: " + data.error.message);
                    return;
                }

                const aiReply = data.choices[0].message.content;
                addMessage('ai', aiReply);
                chatHistory.push({ "role": "assistant", "content": aiReply });
            } catch (e) {
                if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                addMessage('ai', "Connection failed. Please try again.");
            }
        }

        function addMessage(sender, text, id = null) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            if (id) div.id = id;
            div.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('send-btn').onclick = startChat;
        document.getElementById('user-input').onkeypress = (e) => { if (e.key === 'Enter') startChat(); };
    </script>
</body>
</html>
