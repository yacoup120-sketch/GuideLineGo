<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuidelineGo - المساعد الصيدلاني</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        .chat-container { width: 100%; max-width: 450px; background: #1e293b; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; height: 90vh; border: 1px solid #334155; }
        .chat-header { background: #10b981; color: white; padding: 20px; text-align: center; border-bottom: 1px solid #059669; position: relative; }
        .chat-header h2 { margin: 0; font-size: 24px; font-weight: bold; }
        .chat-header p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; }
        .reset-btn { position: absolute; top: 10px; left: 10px; background: transparent; border: 1px solid white; color: white; border-radius: 5px; padding: 3px 8px; font-size: 10px; cursor: pointer; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background-color: #0f172a; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 18px; font-size: 15px; line-height: 1.6; }
        .ai-message { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-right-radius: 2px; }
        .user-message { background: #10b981; color: white; align-self: flex-end; border-bottom-left-radius: 2px; font-weight: 500; }
        .chat-input { display: flex; padding: 15px; background: #1e293b; border-top: 1px solid #334155; }
        .chat-input input { flex: 1; padding: 12px 18px; border: 1px solid #334155; border-radius: 25px; outline: none; background: #0f172a; color: white; margin-left: 10px; }
        .chat-input button { background: #10b981; color: white; border: none; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .chat-input button:hover { background: #059669; }
        b { color: #10b981; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <button class="reset-btn" onclick="resetApiKey()">تغيير المفتاح</button>
            <h2>GuidelineGo 🩺</h2>
            <p>المساعد الذكي للصيادلة - الأردن</p>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message ai-message">أهلاً زميلي. أنا GuidelineGo المربوط بالذكاء الاصطناعي الفعلي. كيف يمكنني مساعدتك في البروتوكولات الطبية اليوم؟</div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="اكتب حالة المريض (مثلاً: مريض ضغط)...">
            <button id="send-btn">إرسال</button>
        </div>
    </div>

    <script>
        // طلب المفتاح وحفظه بالمتصفح
        let apiKey = localStorage.getItem('gemini_api_key');
        if (!apiKey) {
            apiKey = prompt("للاستخدام لأول مرة، يرجى إدخال Gemini API Key الخاص بك:");
            if (apiKey) {
                localStorage.setItem('gemini_api_key', apiKey);
            }
        }

        function resetApiKey() {
            localStorage.removeItem('gemini_api_key');
            location.reload();
        }

        const systemInstruction = "You are an expert Clinical Decision Assistant for Pharmacists in Jordan. Your goal is to guide the pharmacist through clinical guidelines (e.g., Hypertension treatment) using a step-by-step 'Decision Tree' approach. Strict Rules: 1. Ask ONLY ONE question at a time. 2. Suggest Jordanian commercial brands at the end. Reply in Arabic.";
        let chatHistory = [];

        async function startChat() {
            if (!apiKey) {
                addMessage('ai', "لم تقم بإدخال مفتاح API. اضغط على 'تغيير المفتاح' بالأعلى.");
                return;
            }

            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            addMessage('user', message);
            inputField.value = '';
            chatHistory.push({ "role": "user", "parts": [{ "text": message }] });

            const loadingId = 'loading-' + Date.now();
            addMessage('ai', 'جاري التفكير وربط البروتوكولات مع Gemini...', loadingId);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemInstruction }] },
                        contents: chatHistory
                    })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) {
                    addMessage('ai', "خطأ في المفتاح! تأكد من إدخال مفتاح صحيح. (" + data.error.message + ")");
                    return;
                }

                const aiReply = data.candidates[0].content.parts[0].text;
                addMessage('ai', aiReply);
                chatHistory.push({ "role": "model", "parts": [{ "text": aiReply }] });
            } catch (e) {
                if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                addMessage('ai', "حدث خطأ بالاتصال، سأحاول مجدداً.");
            }
        }

        function addMessage(sender, text, id = null) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            if (id) div.id = id;
            div.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('send-btn').onclick = startChat;
        document.getElementById('user-input').onkeypress = (e) => { if (e.key === 'Enter') startChat(); };
    </script>
</body>
</html>
